<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio de sesión</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E7E1}
a{color:#1F1F1C}a:hover{color:#000000}
</style>
</head>
<body>
<div style="width: 1280px; height: 880px; box-sizing: border-box; padding: 20px 32px 32px; background: #F6F5F1; display: flex; flex-direction: column; gap: 12px; font-family: 'IBM Plex Sans', sans-serif; color: #1F1F1C">
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 12px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #55534E">P1</span>
<span style="font-size: 20px; font-weight: 700">Inicio de sesión</span>
</div>
<div style="display: flex; gap: 8px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; padding: 4px 10px; border: 1.5px solid #1F1F1C; border-radius: 6px; background: #FFFFFF">RNF1</span>
</div>
</div>

<div style="flex-grow: 1; border: 2px solid #1F1F1C; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<form style="width: 440px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 8px">
<div style="width: 88px; height: 88px; border: 2px solid #1F1F1C; border-radius: 50%; background: #ECEAE4; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55534E">[Logo]</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; text-align: center">Préstamo de material de laboratorio</h1>
<p style="margin: 0; font-size: 15px; color: #55534E; text-align: center">Entra con tu cuenta de la universidad</p>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px">
<label for="correo" style="font-size: 15px; font-weight: 600">Correo institucional</label>
<span style="font-family: Kalam, cursive; font-size: 14px; font-weight: 700; color: #9A3412; background: #FFEDD5; border: 1.5px solid #9A3412; border-radius: 999px; padding: 0 8px; line-height: 22px; white-space: nowrap">WCAG 3.3.2 · etiqueta fuera de la caja</span>
</div>
<input id="correo" type="email" placeholder="[correo institucional]" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #1F1F1C; border-radius: 8px; font-family: inherit; font-size: 15px; background: #FFFFFF">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="contrasena" style="font-size: 15px; font-weight: 600">Contraseña</label>
<input id="contrasena" type="password" placeholder="••••••••" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #1F1F1C; border-radius: 8px; font-family: inherit; font-size: 15px; background: #FFFFFF">
</div>

<div role="alert" style="padding: 12px 14px; border: 2px dashed #8A877F; border-radius: 8px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55534E">ZONA DE MENSAJES</span>
<span style="font-size: 14px">[Correo o contraseña incorrectos]</span>
</div>

<div style="display: flex; align-items: center; gap: 12px">
<a href="Inicio.html" style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #1F1F1C; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Entrar</a>
<span style="font-family: Kalam, cursive; font-size: 14px; font-weight: 700; color: #9A3412; background: #FFEDD5; border: 1.5px solid #9A3412; border-radius: 999px; padding: 0 8px; line-height: 22px; white-space: nowrap">2.5.8 · 48 px</span>
</div>
<a href="InicioVacio.html" style="align-self: center; font-size: 13px; color: #55534E">(ver: alumno sin préstamos activos)</a>
</form>
</div>
</div>
</body>
</html>
